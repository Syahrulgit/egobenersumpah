name: Publish isolated transaction sandbox preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ego-transaction-sandbox-pages
  cancel-in-progress: true

jobs:
  publish-sandbox-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload isolated sandbox only
        uses: actions/upload-pages-artifact@v3
        with:
          path: tests/fixtures

      - name: Deploy isolated sandbox preview
        id: deployment
        uses: actions/deploy-pages@v4

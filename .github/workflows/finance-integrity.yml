name: EGO finance integrity checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/finance-integrity-2026-11]

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ego_test
          POSTGRES_PASSWORD: ego_test_only
          POSTGRES_DB: ego_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ego_test -d ego_finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated EGO schema fixture
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/finance_integrity_fixture.sql
      - name: Apply Owner confirmation migration
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126000100_transactions_require_owner_confirmation.sql
      - name: Apply atomic debt payment migration
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126000200_atomic_debt_payment.sql
      - name: Test atomic payment, replay, validation, RLS and rollback
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/finance_integrity_integration.sql
      - name: Test concurrent payments cannot overpay the same debt
        run: bash supabase/tests/finance_integrity_concurrency.sh

  personal-rpc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ego_test
          POSTGRES_PASSWORD: ego_test_only
          POSTGRES_DB: ego_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ego_test -d ego_finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      auth-postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: gotrue_test_only
          POSTGRES_DB: postgres
          PGPASSWORD: gotrue_test_only
          PGDATABASE: postgres
          PGPORT: 5432
          POSTGRES_PORT: 5432
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated EGO-PERSONAL schema fixture
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_schema_fixture.sql
      - name: Apply unapplied EGO-PERSONAL RPC candidate
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f docs/ego-personal-rpc-alignment-candidate.sql
      - name: Start isolated PostgREST API
        run: |
          docker run -d --name ego-postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:ego_postgrest_test_only@127.0.0.1:5432/ego_finance_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="ego-personal-integration-test-secret-2026-11-27" \
            postgrest/postgrest:v16.5
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "PostgREST is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs ego-postgrest
          exit 1
      - name: Verify JWT, RLS and RPC through PostgREST HTTP API
        env:
          EGO_TEST_JWT_SECRET: ego-personal-integration-test-secret-2026-11-27
          EGO_POSTGREST_URL: http://127.0.0.1:3000
        run: node supabase/tests/ego_personal_postgrest_integration.mjs
      - name: Configure Supabase Auth database role for isolated GoTrue
        env:
          PGPASSWORD: gotrue_test_only
        run: |
          # Supabase reserves supabase_auth_admin; use the image's supabase_admin
          # bootstrap administrator rather than the restricted postgres role.
          psql -h localhost -p 5433 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE supabase_auth_admin WITH LOGIN PASSWORD 'gotrue_test_only';"
          psql -h localhost -p 5433 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT rolname, rolcanlogin, rolsuper FROM pg_roles WHERE rolname = 'supabase_auth_admin';"
      - name: Inspect isolated Auth user role default
        env:
          PGPASSWORD: gotrue_test_only
        run: |
          psql -h localhost -p 5433 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "SELECT column_name, column_default FROM information_schema.columns WHERE table_schema = 'auth' AND table_name = 'users' AND column_name IN ('role', 'aud');" -c "SELECT current_database() AS database, to_regclass('auth.users') AS auth_users_table;"
      - name: Start isolated Supabase GoTrue Auth
        env:
          POSTGRES_PASSWORD: gotrue_test_only
        run: |
          docker run -d --name ego-gotrue --network host \
            -e GOTRUE_API_HOST=0.0.0.0 \
            -e GOTRUE_API_PORT=9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable" \
            -e GOTRUE_SITE_URL="http://127.0.0.1:9999" \
            -e API_EXTERNAL_URL="http://127.0.0.1:9999" \
            -e GOTRUE_JWT_ISSUER="http://127.0.0.1:9999" \
            -e GOTRUE_JWT_SECRET="ego-personal-integration-test-secret-2026-11-27" \
            -e GOTRUE_JWT_EXP=3600 \
            -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            -e GOTRUE_DISABLE_SIGNUP=false \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_MAILER_AUTOCONFIRM=true \
            supabase/auth:v2.176.0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:9999/health >/dev/null; then
              echo "GoTrue is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs ego-gotrue
          exit 1
      - name: Verify real GoTrue signup, password login and PostgREST JWT
        env:
          EGO_GOTRUE_URL: http://127.0.0.1:9999
          EGO_POSTGREST_URL: http://127.0.0.1:3000
        run: node supabase/tests/ego_personal_gotrue_integration.mjs
      - name: Verify Owner authorization, RPCs, replay, cancellation and rollback
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_rpc_alignment.sql
      - name: Verify concurrent duplicate debt-payment requests
        run: bash supabase/tests/ego_personal_rpc_concurrency.sh
      - name: Apply rollback candidate in isolated fixture
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f docs/ego-personal-rpc-alignment-rollback.sql
      - name: Verify rollback restores original RPC and grants
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_rpc_rollback_assertions.sql

  # Keep this isolated from hosted projects; the disposable fixture models only
  # privileges the local postgres role is actually authorized to alter.
  # Supabase CLI v3 local_smtp uses a dedicated non-default port in config.toml.
  supabase-local-stack:
    name: Full Supabase Local Stack validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Start pinned Supabase CLI local stack (no hosted project link)
        run: |
          npx --yes supabase@3.4.0 --version
          npx --yes supabase@3.4.0 start
      - name: Capture local-only API key
        shell: bash
        run: |
          npx --yes supabase@3.4.0 status -o env > "$RUNNER_TEMP/ego-supabase-local.env"
          KEY="$(sed -n 's/^ANON_KEY=//p; s/^SUPABASE_ANON_KEY=//p; s/^PUBLISHABLE_KEY=//p' "$RUNNER_TEMP/ego-supabase-local.env" | head -n 1 | tr -d '"')"
          if [[ -z "$KEY" ]]; then
            echo "Could not read the local Supabase anon key from CLI status output"
            exit 1
          fi
          echo "EGO_SUPABASE_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Prepare disposable EGO-PERSONAL schema in local Supabase Postgres
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_schema_fixture.sql
      - name: Apply candidate SQL only to disposable local stack
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f docs/ego-personal-rpc-alignment-candidate.sql
      - name: Verify finance RPC, RLS, grants, replay and rollback contract
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_rpc_alignment.sql
      - name: Verify concurrent debt-payment replay and overpayment protection
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/ego_personal_rpc_concurrency.sh
      - name: Verify real local GoTrue signup, login and JWT through Supabase gateway
        env:
          EGO_GOTRUE_URL: http://127.0.0.1:54321/auth/v1
          EGO_POSTGREST_URL: http://127.0.0.1:54321/rest/v1
        run: node supabase/tests/ego_personal_gotrue_integration.mjs
      - name: Verify local PostgREST RPC, RLS and direct-write denial through gateway
        env:
          EGO_POSTGREST_URL: http://127.0.0.1:54321/rest/v1
          EGO_TEST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
        run: node supabase/tests/ego_personal_postgrest_integration.mjs
      - name: Apply rollback only to disposable local stack
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f docs/ego-personal-rpc-alignment-rollback.sql
      - name: Verify rollback restores original RPC and grants
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_rpc_rollback_assertions.sql
      - name: Stop Supabase Local Stack
        if: always()
        run: npx --yes supabase@3.4.0 stop

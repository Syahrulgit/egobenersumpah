name: EGO finance integrity checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/finance-integrity-2026-11]

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ego_test
          POSTGRES_PASSWORD: ego_test_only
          POSTGRES_DB: ego_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ego_test -d ego_finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated EGO schema fixture
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/finance_integrity_fixture.sql
      - name: Apply Owner confirmation migration
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126000100_transactions_require_owner_confirmation.sql
      - name: Apply atomic debt payment migration
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126000200_atomic_debt_payment.sql
      - name: Test atomic payment, replay, validation, RLS and rollback
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/finance_integrity_integration.sql
      - name: Test concurrent payments cannot overpay the same debt
        run: bash supabase/tests/finance_integrity_concurrency.sh

  personal-rpc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ego_test
          POSTGRES_PASSWORD: ego_test_only
          POSTGRES_DB: ego_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ego_test -d ego_finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated EGO-PERSONAL schema fixture
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_schema_fixture.sql
      - name: Apply unapplied EGO-PERSONAL RPC candidate
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f docs/ego-personal-rpc-alignment-candidate.sql
      - name: Start isolated PostgREST API
        run: |
          docker run -d --name ego-postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:ego_postgrest_test_only@127.0.0.1:5432/ego_finance_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="ego-personal-postgrest-test-secret-2026-11-27" \
            postgrest/postgrest:v16.5
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "PostgREST is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs ego-postgrest
          exit 1
      - name: Verify JWT, RLS and RPC through PostgREST HTTP API
        env:
          EGO_TEST_JWT_SECRET: ego-personal-postgrest-test-secret-2026-11-27
          EGO_POSTGREST_URL: http://127.0.0.1:3000
        run: node supabase/tests/ego_personal_postgrest_integration.mjs
      - name: Verify Owner authorization, RPCs, replay, cancellation and rollback
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_rpc_alignment.sql
      - name: Verify concurrent duplicate debt-payment requests
        run: bash supabase/tests/ego_personal_rpc_concurrency.sh
      - name: Apply rollback candidate in isolated fixture
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f docs/ego-personal-rpc-alignment-rollback.sql
      - name: Verify rollback restores original RPC and grants
        env:
          PGPASSWORD: ego_test_only
        run: psql -h localhost -U ego_test -d ego_finance_test -v ON_ERROR_STOP=1 -f supabase/tests/ego_personal_rpc_rollback_assertions.sql

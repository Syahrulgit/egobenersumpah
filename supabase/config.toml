project_id = "ego-personal-local-validation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
# The full-stack contract test provisions its own isolated fixture after startup.
# Disable automatic app migrations against the empty local database.
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
# Avoid the runner-reserved/default Supabase mail UI port 54324.
port = 55324
smtp_port = 55325
pop3_port = 55326

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false
